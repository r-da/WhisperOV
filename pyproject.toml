[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "whisper-ov"
version = "0.1.0"
description = "CLI for Whisper ASR using OpenVINO (CPU/Intel GPU/NPU) and faster-whisper (NVIDIA CUDA)"
requires-python = ">=3.10"
dependencies = [
    "openvino>=2024.3.0",
    "openvino-genai>=2024.3.0",
    "av>=13.0.0",
    "typer>=0.12.0",
    "rich>=13.0.0",
    "huggingface-hub>=0.26.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "ruff>=0.4.0"]
cuda = [
    "faster-whisper>=1.2.1",
    "nvidia-cublas-cu12>=12.9.2.10",
    "nvidia-cudnn-cu12==9.*",
]

[project.scripts]
whisper-ov = "whisper_ov.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 120
target-version = "py310"
